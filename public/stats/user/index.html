<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Viewer messages</title>
    <style>
      :root {
        color-scheme: dark;
        --accent: #d6ff3f;
        --bg: #11140f;
        --text: #f4f1ea;
        --muted: #c8c2b6;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: Bahnschrift, "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      main {
        max-width: 48rem;
        padding: 2.5rem 1.5rem;
      }
      a {
        color: var(--accent);
      }
      .muted {
        color: var(--muted);
      }
      h1 {
        margin-bottom: 0.35rem;
      }
      .swatch {
        display: inline-block;
        width: 0.85rem;
        height: 0.85rem;
        border-radius: 999px;
        vertical-align: -0.1rem;
        margin-right: 0.45rem;
        box-shadow: 0 0 0 1px rgb(255 255 255 / 20%);
      }
      .log {
        list-style: none;
        margin: 1.5rem 0 0;
        padding: 0;
      }
      .log li {
        padding: 0.7rem 0;
        border-bottom: 1px solid color-mix(in srgb, var(--accent) 18%, transparent);
      }
      time {
        display: block;
        font-size: 0.8rem;
        color: var(--muted);
        margin-bottom: 0.2rem;
      }
      .msg {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <main>
      <p>
        <a href="/stats/">Chat stats</a> ·
        <a href="/">Home</a> ·
        <a href="/login/" id="sign-out" hidden>Sign out</a>
      </p>
      <h1 id="title">Viewer</h1>
      <p id="meta" class="muted">Loading…</p>
      <ol id="log" class="log"></ol>
    </main>
    <script src="./user.js"></script>
    <script src="/app-nav.js"></script>
  </body>
</html>
