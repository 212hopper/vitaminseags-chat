<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat stats</title>
    <link rel="stylesheet" href="/dashboard/style.css" />
    <style>
      a.user-link {
        color: inherit;
        text-decoration: none;
      }
      a.user-link:hover {
        color: var(--accent);
        text-decoration: underline;
      }
      td.count {
        font-variant-numeric: tabular-nums;
        font-weight: 700;
      }
      .swatch {
        display: inline-block;
        width: 0.75rem;
        height: 0.75rem;
        border-radius: 999px;
        vertical-align: -0.05rem;
        margin-right: 0.4rem;
        box-shadow: 0 0 0 1px rgb(255 255 255 / 20%);
      }
    </style>
  </head>
  <body>
    <main>
      <nav id="app-nav" class="nav"></nav>
      <h1>Chat stats</h1>
      <p class="muted">Click a username to read every stored message from that viewer. Counts start from when this app began saving chat. <code>!colour</code> commands are not stored.</p>
      <table>
        <thead>
          <tr>
            <th>User</th>
            <th>Login</th>
            <th>Messages</th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr><td colspan="3" class="muted">Loading…</td></tr>
        </tbody>
      </table>
    </main>
    <script src="./stats.js"></script>
    <script src="/app-nav.js"></script>
  </body>
</html>
