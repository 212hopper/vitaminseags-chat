<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Username remaps</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <main>
      <nav id="app-nav" class="nav"></nav>

      <h1>Username remaps</h1>
      <p class="muted">
        Joke names on the overlay only. Chatters can set their own with <code>!username sloppy212</code>.
        Block a remap to stop that person changing it from chat.
      </p>

      <section class="panel">
        <h2>Add or update</h2>
        <form id="remap-form">
          <div class="grid">
            <label>
              Twitch login
              <input id="login" name="login" type="text" maxlength="25" required placeholder="hopper212" />
            </label>
            <label>
              On-screen name
              <input id="alias" name="alias" type="text" maxlength="32" required placeholder="sloppy212" />
            </label>
            <label class="check">
              <input id="blocked" name="blocked" type="checkbox" />
              Block chatter from changing this
            </label>
          </div>
          <div class="row" style="margin-top: 1rem">
            <button type="submit">Save remap</button>
            <button id="reset-form" class="secondary" type="button">Clear form</button>
          </div>
          <p id="flash" class="flash"></p>
        </form>
      </section>

      <section class="panel">
        <h2>Current remaps</h2>
        <table>
          <thead>
            <tr>
              <th>Twitch login</th>
              <th>On-screen name</th>
              <th>Blocked</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="rows">
            <tr><td colspan="4" class="muted">Loading…</td></tr>
          </tbody>
        </table>
      </section>
    </main>
    <script src="./remaps.js"></script>
    <script src="/app-nav.js"></script>
  </body>
</html>
