services:
  companion:
    build: .
    container_name: vitaminseags-chat
    restart: unless-stopped
    ports:
      - "30009:30009"
    environment:
      HOST: "0.0.0.0"
      PORT: "30009"
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET}
      TWITCH_CHANNEL: ${TWITCH_CHANNEL}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      TWITCH_REDIRECT_URI: ${TWITCH_REDIRECT_URI:-}
      TWITCH_ACCESS_TOKEN: ${TWITCH_ACCESS_TOKEN:-}
      TWITCH_REFRESH_TOKEN: ${TWITCH_REFRESH_TOKEN:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      FASTIFY_LOG_LEVEL: ${FASTIFY_LOG_LEVEL:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      OVERLAY_MAX_MESSAGES: ${OVERLAY_MAX_MESSAGES:-14}
      OVERLAY_HOLD_MS: ${OVERLAY_HOLD_MS:-25000}
      OVERLAY_FADE_MS: ${OVERLAY_FADE_MS:-600}
      OVERLAY_HIDE_COMMANDS: ${OVERLAY_HIDE_COMMANDS:-true}
    volumes:
      - chat-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||30009)+'/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  chat-data:
