services:
  companion:
    build: .
    container_name: vitaminseags-chat
    restart: unless-stopped
    ports:
      - "30009:30009"
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      PORT: "30009"
    volumes:
      - chat-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||30009)+'/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  chat-data:
